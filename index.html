<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHARKMOD - Editor</title>

  <!-- Favicon setup using 2nd Image -->
  <link rel="icon" type="image/png" href="src/favicon.png">

  <!-- Load Blockly core -->
  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/en.js"></script>

  <!-- Icons & Typography -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Scratch UI Colors from Screenshot */
      --scratch-purple: #855cd6;
      --scratch-purple-dark: #6e41c4;
      --scratch-bg: #e9f0f8;
      --scratch-panel-bg: #ffffff;
      --scratch-border: #d9e3f0;
      --scratch-text: #575e75;
      --scratch-green: #4cbf56;
      --scratch-red: #ff4c4c;
      --scratch-yellow: #ffab19;
      --scratch-motion: #4c97ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    body { background-color: var(--scratch-bg); color: var(--scratch-text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }

    /* 1. Top Navbar (Purple Scratch Header) */
    header {
      background: var(--scratch-purple);
      height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1rem;
      color: #fff;
    }

    .nav-left { display: flex; align-items: center; gap: 0.75rem; }
    
    /* Logo from 3rd Image */
    .brand-logo {
      height: 30px;
      width: auto;
      object-fit: contain;
      cursor: pointer;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(0,0,0,0.1);
    }
    .nav-item:hover { background: rgba(0,0,0,0.2); }

    .project-title {
      background: var(--scratch-purple-dark);
      border: 1px solid rgba(0,0,0,0.15);
      color: #fff;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      outline: none;
    }

    .btn-share {
      background: var(--scratch-yellow);
      color: #fff;
      border: none;
      padding: 5px 14px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* 2. Main Workspace Layout (Scratch 3.0 Grid) */
    main {
      display: grid;
      grid-template-columns: 1fr 440px;
      height: calc(100vh - 48px);
      overflow: hidden;
    }

    /* Left Panel: Tabs & Blockly Canvas */
    .editor-section {
      display: flex;
      flex-direction: column;
      background: #fff;
      border-right: 1px solid var(--scratch-border);
    }

    .tab-bar {
      display: flex;
      background: #fff;
      border-bottom: 1px solid var(--scratch-border);
      padding-left: 0.5rem;
      gap: 0.25rem;
    }

    .tab {
      padding: 8px 16px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #888;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab.active {
      color: var(--scratch-purple);
      border-bottom-color: var(--scratch-purple);
    }

    #blocklyDiv { flex: 1; width: 100%; }

    /* Right Panel: Stage + Controls + Sprites List */
    .stage-section {
      display: flex;
      flex-direction: column;
      background: var(--scratch-bg);
      padding: 0.5rem;
      gap: 0.5rem;
      overflow-y: auto;
    }

    /* Stage Controls Bar */
    .stage-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px;
    }

    .green-flag, .stop-sign {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    .green-flag { background: #e6f9e6; color: var(--scratch-green); }
    .stop-sign { background: #ffe6e6; color: var(--scratch-red); }

    /* Canvas Frame */
    .stage-canvas-card {
      background: #fff;
      border: 1px solid var(--scratch-border);
      border-radius: 8px;
      overflow: hidden;
    }

    canvas { display: block; width: 100%; height: 320px; background: #fff; }

    /* Sprite Settings Panel */
    .sprite-info-pane {
      background: #fff;
      border: 1px solid var(--scratch-border);
      border-radius: 8px;
      padding: 0.75rem;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: #575e75;
    }

    .info-group { display: flex; align-items: center; gap: 4px; }
    .info-input {
      width: 100%;
      padding: 4px 6px;
      border: 1px solid var(--scratch-border);
      border-radius: 12px;
      text-align: center;
      font-size: 0.75rem;
      background: var(--scratch-bg);
    }

    /* Sprites & Backdrops Container */
    .assets-container {
      display: grid;
      grid-template-columns: 1fr 100px;
      gap: 0.5rem;
      flex: 1;
    }

    .sprite-selector, .backdrop-selector {
      background: #fff;
      border: 1px solid var(--scratch-border);
      border-radius: 8px;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
    }

    .section-title { font-size: 0.7rem; font-weight: 700; color: #888; margin-bottom: 0.5rem; }

    .sprite-grid { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .sprite-box {
      width: 68px;
      height: 68px;
      border: 2px solid var(--scratch-purple);
      border-radius: 8px;
      background: #f9f5ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }

    .sprite-box img { width: 36px; height: 36px; object-fit: contain; }
    .sprite-box span { font-size: 0.65rem; font-weight: 600; margin-top: 2px; }

    /* Custom Theme Overrides for Blockly Workspace */
    .blocklySvg { background-color: #f9fafc !important; }
    .blocklyToolboxDiv { background-color: #fff !important; border-right: 1px solid var(--scratch-border) !important; }
  </style>
</head>
<body>

  <!-- 1. Top Scratch Navigation Header -->
  <header>
    <div class="nav-left">
      <!-- 3rd Image: SHARKMOD text logo -->
      <img src="src/logo.png" alt="SHARKMOD" class="brand-logo" onerror="this.src='https://api.iconify.design/twemoji:shark.svg';">
      <div class="nav-item"><i class="fa-solid fa-globe"></i></div>
      <div class="nav-item">Settings <i class="fa-solid fa-caret-down"></i></div>
      <div class="nav-item">File <i class="fa-solid fa-caret-down"></i></div>
      <div class="nav-item">Edit <i class="fa-solid fa-caret-down"></i></div>
      <input type="text" class="project-title" value="SharkProject-1">
      <button class="btn-share">Share</button>
    </div>
  </header>

  <!-- 2. Scratch Editor Main Layout -->
  <main>
    <div class="editor-section">
      <!-- Tab Controls -->
      <div class="tab-bar">
        <div class="tab active"><i class="fa-solid fa-code"></i> Code</div>
        <div class="tab"><i class="fa-solid fa-paint-brush"></i> Costumes</div>
        <div class="tab"><i class="fa-solid fa-volume-high"></i> Sounds</div>
      </div>
      <!-- Blockly Workspace -->
      <div id="blocklyDiv"></div>
    </div>

    <!-- Right Side Stage Dashboard -->
    <div class="stage-section">
      <!-- Green Flag & Stop Button -->
      <div class="stage-bar">
        <div style="display:flex; gap:0.5rem;">
          <button class="green-flag" id="runBtn"><i class="fa-solid fa-flag"></i></button>
          <button class="stop-sign" id="stopBtn"><i class="fa-solid fa-circle"></i></button>
        </div>
      </div>

      <!-- Stage Canvas Frame -->
      <div class="stage-canvas-card">
        <canvas id="stageCanvas" width="480" height="360"></canvas>
      </div>

      <!-- Sprite Parameter Inputs -->
      <div class="sprite-info-pane">
        <div class="info-group">Sprite <input type="text" class="info-input" value="Shark"></div>
        <div class="info-group">X <input type="text" class="info-input" id="inputX" value="0"></div>
        <div class="info-group">Y <input type="text" class="info-input" id="inputY" value="0"></div>
        <div class="info-group">Size <input type="text" class="info-input" value="100"></div>
      </div>

      <!-- Sprites and Backdrop Selector Grid -->
      <div class="assets-container">
        <div class="sprite-selector">
          <div class="section-title">Sprites</div>
          <div class="sprite-grid">
            <div class="sprite-box">
              <img src="src/shark.svg" alt="Shark" onerror="this.src='https://api.iconify.design/twemoji:shark.svg';">
              <span>Shark</span>
            </div>
          </div>
        </div>
        <div class="backdrop-selector">
          <div class="section-title">Stage</div>
          <div style="text-align:center; font-size:0.7rem; font-weight:bold; margin-top:0.5rem;">Ocean</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // 1. Stage Engine Configuration
    const canvas = document.getElementById('stageCanvas');
    const ctx = canvas.getContext('2d');

    const state = {
      sprite: {
        x: 240,
        y: 180,
        size: 70,
        rotation: 0,
        img: new Image()
      }
    };
    state.sprite.img.src = 'src/shark.svg';
    state.sprite.img.onerror = () => {
      state.sprite.img.src = 'https://api.iconify.design/twemoji:shark.svg';
    };

    function renderStage() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background Grid Pattern like Scratch
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Render Sprite
      ctx.save();
      ctx.translate(state.sprite.x, state.sprite.y);
      ctx.rotate((state.sprite.rotation * Math.PI) / 180);
      ctx.drawImage(
        state.sprite.img,
        -state.sprite.size / 2,
        -state.sprite.size / 2,
        state.sprite.size,
        state.sprite.size
      );
      ctx.restore();

      // Update X/Y input values
      document.getElementById('inputX').value = Math.round(state.sprite.x - 240);
      document.getElementById('inputY').value = Math.round(180 - state.sprite.y);
    }
    state.sprite.img.onload = renderStage;

    // Generator accessor compatibility
    const jsGen = (typeof javascript !== 'undefined' && javascript.javascriptGenerator) 
      ? javascript.javascriptGenerator 
      : Blockly.JavaScript;

    // 2. Custom Scratch Motion Blocks
    Blockly.Blocks['move_steps'] = {
      init: function() {
        this.appendValueInput("STEPS").setCheck("Number").appendField("move");
        this.appendDummyInput().appendField("steps");
        this.setPreviousStatement(true); this.setNextStatement(true);
        this.setColour("#4c97ff");
      }
    };

    jsGen.forBlock['move_steps'] = function(block, generator) {
      const steps = generator.valueToCode(block, 'STEPS', 0) || '0';
      return `moveSteps(${steps});\n`;
    };

    Blockly.Blocks['turn_right'] = {
      init: function() {
        this.appendValueInput("DEGREES").setCheck("Number").appendField("turn ↻");
        this.appendDummyInput().appendField("degrees");
        this.setPreviousStatement(true); this.setNextStatement(true);
        this.setColour("#4c97ff");
      }
    };

    jsGen.forBlock['turn_right'] = function(block, generator) {
      const deg = generator.valueToCode(block, 'DEGREES', 0) || '0';
      return `turnRight(${deg});\n`;
    };

    // 3. Inject Blockly Workspace with Scratch Palette Colors
    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: {
        kind: "categoryToolbox",
        contents: [
          {
            kind: "category", name: "Motion", colour: "#4c97ff",
            contents: [
              { kind: "block", type: "move_steps" },
              { kind: "block", type: "turn_right" }
            ]
          },
          {
            kind: "category", name: "Operators", colour: "#59c059",
            contents: [{ kind: "block", type: "math_number" }]
          }
        ]
      },
      grid: { spacing: 20, length: 3, colour: '#e9f0f8', snap: true },
      trashcan: true
    });

    // 4. Execution API
    function moveSteps(steps) {
      const rad = (state.sprite.rotation * Math.PI) / 180;
      state.sprite.x += Math.cos(rad) * steps;
      state.sprite.y += Math.sin(rad) * steps;
      renderStage();
    }

    function turnRight(deg) {
      state.sprite.rotation += Number(deg);
      renderStage();
    }

    document.getElementById('runBtn').addEventListener('click', () => {
      const code = jsGen.workspaceToCode(workspace);
      try {
        const run = new Function('moveSteps', 'turnRight', code);
        run(moveSteps, turnRight);
      } catch (err) {
        console.error(err);
      }
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
      state.sprite.x = 240;
      state.sprite.y = 180;
      state.sprite.rotation = 0;
      renderStage();
    });
  </script>
</body>
</html>
