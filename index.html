<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shark Mod Studio</title>

  <!-- Load Blockly core -->
  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <!-- Load the default blocks -->
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <!-- Load a generator -->
  <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
  <!-- Load a message file -->
  <script src="https://unpkg.com/blockly/msg/en.js"></script>

  <!-- Icons & Typography -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --shark-cyan: #23ffd9;
      --shark-cyan-glow: rgba(35, 255, 217, 0.35);
      --shark-dark-bg: #030a16;
      --shark-panel-bg: #09172a;
      --shark-border: #142a45;
      --shark-text: #f1f5f9;
      --scratch-green: #22c55e;
      --scratch-red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--shark-dark-bg); color: var(--shark-text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Top Navigation Header */
    header {
      background: var(--shark-panel-bg);
      border-bottom: 2px solid var(--shark-cyan);
      padding: 0 1.25rem;
      height: 54px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 15px var(--shark-cyan-glow);
      z-index: 10;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      background: var(--shark-cyan);
      color: #030a16;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      box-shadow: 0 0 10px var(--shark-cyan-glow);
    }

    .brand-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
      -webkit-text-stroke: 1.5px var(--shark-cyan);
      text-shadow: 0 0 10px var(--shark-cyan-glow);
    }

    .controls { display: flex; gap: 0.75rem; align-items: center; }

    .btn-go {
      background: var(--scratch-green);
      color: #fff;
      border: none;
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
      transition: transform 0.1s;
    }

    .btn-stop {
      background: var(--scratch-red);
      color: #fff;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
      transition: transform 0.1s;
    }

    .btn-go:active, .btn-stop:active { transform: scale(0.92); }

    /* Main Workspace Layout */
    main {
      display: grid;
      grid-template-columns: 1fr 450px;
      height: calc(100vh - 54px);
    }

    #blocklyDiv { height: 100%; width: 100%; }

    /* Stage Panel */
    .stage-section {
      background: var(--shark-panel-bg);
      border-left: 2px solid var(--shark-border);
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 1rem;
    }

    .stage-card {
      background: #000;
      border: 2px solid var(--shark-cyan);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 18px var(--shark-cyan-glow);
    }

    .stage-header {
      background: rgba(9, 23, 42, 0.95);
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--shark-cyan);
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--shark-border);
    }

    canvas { display: block; width: 100%; height: 300px; }

    .sprite-pane {
      background: rgba(3, 10, 22, 0.7);
      border: 1px solid var(--shark-border);
      border-radius: 10px;
      padding: 1rem;
      flex-grow: 1;
    }

    .sprite-pane-header {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 0.75rem;
    }

    .sprite-card {
      background: var(--shark-panel-bg);
      border: 2px solid var(--shark-cyan);
      border-radius: 8px;
      padding: 0.5rem;
      text-align: center;
      width: 85px;
      box-shadow: 0 0 10px var(--shark-cyan-glow);
    }

    .sprite-card img { width: 44px; height: 44px; object-fit: contain; }
    .sprite-card span { display: block; font-size: 0.75rem; margin-top: 4px; font-weight: 600; }

    /* Blockly Theme Styling */
    .blocklySvg { background-color: #040c1a !important; }
    .blocklyToolboxDiv { background-color: var(--shark-panel-bg) !important; border-right: 1px solid var(--shark-border) !important; }
    .blocklyFlyoutBackground { fill: #061224 !important; }
  </style>
</head>
<body>

  <!-- Top Bar Navbar -->
  <header>
    <div class="brand-container">
      <div class="brand-icon">S</div>
      <div class="brand-title">SHARKMOD</div>
    </div>
    <div class="controls">
      <button class="btn-go" id="runBtn"><i class="fa-solid fa-flag"></i> GO</button>
      <button class="btn-stop" id="stopBtn"><i class="fa-solid fa-stop"></i></button>
    </div>
  </header>

  <!-- Workspace Grid -->
  <main>
    <div id="blocklyDiv"></div>

    <!-- Stage View -->
    <div class="stage-section">
      <div class="stage-card">
        <div class="stage-header">
          <span>STAGE (480x360)</span>
          <span>FPS: 60</span>
        </div>
        <canvas id="stageCanvas" width="480" height="360"></canvas>
      </div>

      <!-- Sprite Manager -->
      <div class="sprite-pane">
        <div class="sprite-pane-header">Sprites & Backdrops</div>
        <div class="sprite-card">
          <img src="https://api.iconify.design/twemoji:shark.svg" alt="Shark Sprite">
          <span>Shark</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    // 1. Stage Engine Configuration
    const canvas = document.getElementById('stageCanvas');
    const ctx = canvas.getContext('2d');

    const state = {
      backdrop: 'ocean',
      sprite: {
        x: 240,
        y: 180,
        size: 70,
        rotation: 0,
        img: new Image()
      }
    };
    state.sprite.img.src = 'https://api.iconify.design/twemoji:shark.svg';

    function renderStage() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (state.backdrop === 'ocean') {
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#004e89');
        gradient.addColorStop(1, '#001a33');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else if (state.backdrop === 'abyss') {
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#09172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      ctx.save();
      ctx.translate(state.sprite.x, state.sprite.y);
      ctx.rotate((state.sprite.rotation * Math.PI) / 180);
      ctx.drawImage(
        state.sprite.img,
        -state.sprite.size / 2,
        -state.sprite.size / 2,
        state.sprite.size,
        state.sprite.size
      );
      ctx.restore();
    }
    state.sprite.img.onload = renderStage;

    // Helper compatibility accessor for modern Blockly versions vs CDN versions
    const jsGen = (typeof javascript !== 'undefined' && javascript.javascriptGenerator) 
      ? javascript.javascriptGenerator 
      : Blockly.JavaScript;

    // 2. Define Custom Blocks
    Blockly.Blocks['move_steps'] = {
      init: function() {
        this.appendValueInput("STEPS").setCheck("Number").appendField("move");
        this.appendDummyInput().appendField("steps");
        this.setPreviousStatement(true); this.setNextStatement(true);
        this.setColour("#22c55e");
      }
    };

    jsGen.forBlock['move_steps'] = function(block, generator) {
      const steps = generator.valueToCode(block, 'STEPS', 0) || '0';
      return `moveSteps(${steps});\n`;
    };

    Blockly.Blocks['turn_right'] = {
      init: function() {
        this.appendValueInput("DEGREES").setCheck("Number").appendField("turn ↻");
        this.appendDummyInput().appendField("degrees");
        this.setPreviousStatement(true); this.setNextStatement(true);
        this.setColour("#22c55e");
      }
    };

    jsGen.forBlock['turn_right'] = function(block, generator) {
      const deg = generator.valueToCode(block, 'DEGREES', 0) || '0';
      return `turnRight(${deg});\n`;
    };

    Blockly.Blocks['switch_backdrop'] = {
      init: function() {
        this.appendDummyInput()
            .appendField("switch backdrop to")
            .appendField(new Blockly.FieldDropdown([
              ["Deep Ocean", "ocean"],
              ["Dark Abyss", "abyss"],
              ["Grid Mode", "grid"]
            ]), "BG");
        this.setPreviousStatement(true); this.setNextStatement(true);
        this.setColour("#23ffd9");
      }
    };

    jsGen.forBlock['switch_backdrop'] = function(block) {
      return `switchBackdrop("${block.getFieldValue('BG')}");\n`;
    };

    // 3. Inject Blockly Workspace
    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: {
        kind: "categoryToolbox",
        contents: [
          {
            kind: "category", name: "Motion", colour: "#22c55e",
            contents: [
              { kind: "block", type: "move_steps" },
              { kind: "block", type: "turn_right" }
            ]
          },
          {
            kind: "category", name: "Looks", colour: "#23ffd9",
            contents: [{ kind: "block", type: "switch_backdrop" }]
          },
          {
            kind: "category", name: "Operators", colour: "#3b82f6",
            contents: [{ kind: "block", type: "math_number" }]
          }
        ]
      },
      grid: { spacing: 20, length: 3, colour: '#142a45', snap: true },
      trashcan: true
    });

    // 4. Execution Logic
    function moveSteps(steps) {
      const rad = (state.sprite.rotation * Math.PI) / 180;
      state.sprite.x += Math.cos(rad) * steps;
      state.sprite.y += Math.sin(rad) * steps;
      renderStage();
    }

    function turnRight(deg) {
      state.sprite.rotation += Number(deg);
      renderStage();
    }

    function switchBackdrop(bg) {
      state.backdrop = bg;
      renderStage();
    }

    document.getElementById('runBtn').addEventListener('click', () => {
      const code = jsGen.workspaceToCode(workspace);
      try {
        const run = new Function('moveSteps', 'turnRight', 'switchBackdrop', code);
        run(moveSteps, turnRight, switchBackdrop);
      } catch (err) {
        console.error(err);
      }
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
      state.sprite.x = 240;
      state.sprite.y = 180;
      state.sprite.rotation = 0;
      state.backdrop = 'ocean';
      renderStage();
    });
  </script>
</body>
</html>
